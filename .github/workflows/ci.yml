name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  lint:
    name: Lint and vet
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify gofmt
        run: |
          set -euo pipefail
          files=$(gofmt -s -l . | grep -Ev '^(vendor/|$)' || true)
          if [[ -n "${files}" ]]; then
            echo "These files are not gofmt-formatted:"
            echo "${files}"
            echo "Run: gofmt -s -w ."
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Check go.mod is tidy
        run: |
          set -euo pipefail
          cp go.mod go.mod.bak
          cp go.sum go.sum.bak
          go mod tidy
          if ! diff -u go.mod.bak go.mod >/dev/null || ! diff -u go.sum.bak go.sum >/dev/null; then
            echo "go.mod/go.sum changed after 'go mod tidy'. Please run it locally and commit."
            git --no-pager diff -- go.mod go.sum
            exit 1
          fi

  test:
    name: Test (Ginkgo) + coverage
    runs-on: ${{ matrix.os }}
    needs: [lint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download modules
        run: go mod download

      - name: Install Ginkgo
        run: |
          set -euo pipefail
          version=$(go list -m -f '{{.Version}}' github.com/onsi/ginkgo/v2)
          go install github.com/onsi/ginkgo/v2/ginkgo@"${version}"

      - name: Create coverage directory
        run: mkdir -p coverage

      - name: Run tests with coverage
        run: |
          set -euo pipefail
          ginkgo -r --cover --output-dir coverage --keep-separate-coverprofiles

      - name: Upload coverage artifacts
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.os }}
          path: coverage/

  build:
    name: Cross-compile smoke builds
    runs-on: ubuntu-latest
    needs: [test]
    strategy:
      fail-fast: true
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build ${{ matrix.goos }}-${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          set -euo pipefail
          date_rfc3339=$(date -u +'%Y-%m-%dT%H:%M:%SZ')
          ldflags="-X github.com/louiss0/cobra-cli-template/build_info.rawCLI_VERSION=dev -X github.com/louiss0/cobra-cli-template/build_info.rawBUILD_DATE=${date_rfc3339} -X github.com/louiss0/g-tools/mode.buildMode=production -s -w"
          mkdir -p dist
          out="dist/cobra-cli-template-${GOOS}-${GOARCH}"
          if [[ "${GOOS}" == "windows" ]]; then out="${out}.exe"; fi
          go build -trimpath -ldflags "${ldflags}" -o "${out}" ./main.go

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: cobra-cli-template-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/
